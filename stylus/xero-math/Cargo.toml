[package]
name = "xero-math"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Xero Protocol pricing engine for Arbitrum Stylus: maturity-aware Dividend Strip AMM math and implied dividend curves"

[dependencies]
alloy-primitives = "=1.7.3"
alloy-sol-types = "=1.7.3"
stylus-sdk = "=0.10.9"

[dev-dependencies]
serde_json = "1"
stylus-sdk = { version = "=0.10.9", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "xero-math-abi"
path = "src/main.rs"
required-features = ["export-abi"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
