[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "../stylus/xero-math/vectors" },
  { access = "read", path = "../deploy" },
  { access = "read-write", path = "../deploy/out" },
  { access = "read-write", path = "../app/src/deployments" },
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[fmt]
line_length = 110

[lint]
lint_on_build = false

[rpc_endpoints]
base = "${BASE_RPC_URL:-https://mainnet.base.org}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
