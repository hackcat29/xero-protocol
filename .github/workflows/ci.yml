name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (unit, fuzz, invariant, parity)
        working-directory: contracts
        run: forge test -vv

  stylus:
    name: Stylus engine (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus/xero-math
      - name: Test against shared parity vectors
        working-directory: stylus/xero-math
        run: cargo test --release

  keeper:
    name: Keeper (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/keeper
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/keeper/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  app:
    name: App (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compile contracts for ABIs
        working-directory: contracts
        run: forge build
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build for Robinhood Chain testnet
        working-directory: app
        env:
          VITE_CHAIN_ID: '46630'
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: app/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [contracts, stylus, keeper, app]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check Cloudflare credentials
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy. Add it under Settings → Secrets → Actions."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/download-artifact@v8
        if: env.HAS_TOKEN == 'true'
        with:
          name: app-dist
          path: app/dist
      - name: wrangler deploy
        if: env.HAS_TOKEN == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: '4'
          command: deploy --message "${{ github.sha }}"
